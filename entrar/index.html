<script>
/* ============================================================
   RODÍZIO DE GRUPOS — a recepção é a página da agência; aqui só
   se escolhe a sala. Pra tirar um grupo lotado ou suspenso, apague
   a linha dele. Pra abrir outro, acrescente uma linha.
   ============================================================ */
var SALAS = [
  "https://chat.whatsapp.com/KtGUXQt3ca2HfGGc5ZNaHO",
  "https://chat.whatsapp.com/FrwVlyDMv9L3s1JL7zggPn",
  "https://chat.whatsapp.com/GovxL6mjMoN517POeQJbPI",
  "https://chat.whatsapp.com/KfvkRjX3t7T0fOzIqLkCQo",
  "https://chat.whatsapp.com/G64ycfCj0ak2LDpyweUUWb"
];

(function(){
  /* quem já foi sorteado uma vez cai sempre na mesma sala */
  var escolha = -1;
  try{
    var lembrada = localStorage.getItem("rainha_sala");
    if (lembrada !== null && SALAS.indexOf(lembrada) >= 0) escolha = SALAS.indexOf(lembrada);
  }catch(e){}
  if (escolha < 0){
    escolha = Math.floor(Math.random() * SALAS.length);
    try{ localStorage.setItem("rainha_sala", SALAS[escolha]); }catch(e){}
  }
  var destino = SALAS[escolha];

  var botao = document.getElementById("ir");
  botao.href = destino;

  /* catraca: conta no Firebase quantos foram pra cada sala (uma vez por visita) */
  try{
    if (!sessionStorage.getItem("rainha_entrar_contou")){
      sessionStorage.setItem("rainha_entrar_contou", "1");
      var PROJ = "lives-da-rainha",
          KEY  = "AIzaSyA6qO04sAW0nPFKg_z40CRXGAC0x4E70dE",
          RAIZ = "projects/" + PROJ + "/databases/(default)/documents",
          DOC  = RAIZ + "/visitas/entrar_sala" + (escolha + 1),
          d = new Date(), m = d.getMonth()+1, x = d.getDate(),
          dia = "d_" + d.getFullYear() + (m<10?"0":"") + m + (x<10?"0":"") + x;
      fetch("https://firestore.googleapis.com/v1/" + RAIZ + ":commit?key=" + KEY, {
        method:"POST", headers:{"Content-Type":"application/json"}, keepalive:true,
        body: JSON.stringify({ writes:[{
          update:{ name: DOC, fields:{} },
          updateMask:{ fieldPaths:["marcador"] },
          updateTransforms:[
            { fieldPath:"total", increment:{ integerValue:"1" } },
            { fieldPath:dia,     increment:{ integerValue:"1" } },
            { fieldPath:"ultima", setToServerValue:"REQUEST_TIME" }
          ]
        }]})
      }).catch(function(){});
    }
  }catch(e){}

  /* meio segundo pra catraca e pixel saírem, e vai */
  setTimeout(function(){ location.replace(destino); }, 500);
})();
</script>
